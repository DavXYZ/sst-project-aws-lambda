name: Test Workflow

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test Job
    runs-on: ubuntu-latest
    steps:
      - name: Print hello
        run: echo "Hello from GitHub Actions!"

      - name: Print environment
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub event: ${{ github.event_name }}"

      - name: Test secrets exist
        run: |
          echo "Testing if secrets are accessible..."
          if [ -n "$TEST_SECRET" ]; then
            echo "AWS_ACCESS_KEY_ID exists (length: ${#TEST_SECRET})"
          else
            echo "AWS_ACCESS_KEY_ID is NOT set"
          fi
        env:
          TEST_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Success
        run: echo "All tests passed!"

