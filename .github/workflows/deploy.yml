name: Deploy SST

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage || github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    concurrency:
      group: sstproject-deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage || github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      STAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage || github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Determine stage
        id: stage
        run: |
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying to stage: $STAGE"

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Build frontend
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.execute-api.us-east-1.amazonaws.com
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare SST log files
        shell: bash
        run: |
          mkdir -p .sst/log
          : > .sst/log/pulumi.log
          : > .sst/log/sst.log
          ls -la .sst/log

      - name: Clear stale SST lock
        shell: bash
        run: |
          echo "Attempting to clear any stale SST lock for stage '${{ steps.stage.outputs.stage }}'..."
          mkdir -p .sst/log
          : > .sst/log/pulumi.log
          npx sst unlock --stage "${{ steps.stage.outputs.stage }}" || true
        env:
          SST_LOG: debug
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to ${{ steps.stage.outputs.stage }}
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          echo "Starting SST deploy for stage '${{ steps.stage.outputs.stage }}'"
          mkdir -p .sst/log
          : > .sst/log/pulumi.log
          : > .sst/log/sst.log

          if npx sst deploy --stage "${{ steps.stage.outputs.stage }}" --print-logs 2>&1 | tee "$LOG_FILE"; then
            echo "SST deploy completed successfully"
            exit 0
          fi

          if [ -d .sst/log ]; then
            echo "----- .sst/log contents -----"
            ls -la .sst/log
            echo "----- end .sst/log contents -----"

            shopt -s nullglob
            for file in .sst/log/*.log; do
              echo "----- $file -----"
              cat "$file"
              echo "----- end $file -----"
            done
          fi

          if grep -q "A concurrent update was detected on the app" "$LOG_FILE"; then
            echo "Detected stale SST lock. Unlocking stage '${{ steps.stage.outputs.stage }}' and retrying once..."
            npx sst unlock --stage "${{ steps.stage.outputs.stage }}"
            npx sst deploy --stage "${{ steps.stage.outputs.stage }}" --print-logs
            exit 0
          fi

          echo "SST deploy failed for a reason other than a lock. See log above."
          exit 1
        env:
          SST_LOG: debug
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
