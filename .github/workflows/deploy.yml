name: Deploy SST

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: sstproject-deploy
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            STAGE="production"
          else
            STAGE="dev"
          fi
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "Deploying to stage: $STAGE"

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Build frontend
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.execute-api.us-east-1.amazonaws.com
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Clear stale SST lock
        shell: bash
        run: |
          echo "Attempting to clear any stale SST lock for stage '${{ steps.stage.outputs.stage }}'..."
          npx sst unlock --stage "${{ steps.stage.outputs.stage }}" || true
        env:
          SST_LOG: debug
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to ${{ steps.stage.outputs.stage }}
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          echo "Starting SST deploy for stage '${{ steps.stage.outputs.stage }}'"

          if npx sst deploy --stage "${{ steps.stage.outputs.stage }}" 2>&1 | tee "$LOG_FILE"; then
            echo "SST deploy completed successfully"
            exit 0
          fi

          if grep -q "A concurrent update was detected on the app" "$LOG_FILE"; then
            echo "Detected stale SST lock. Unlocking stage '${{ steps.stage.outputs.stage }}' and retrying once..."
            npx sst unlock --stage "${{ steps.stage.outputs.stage }}"
            npx sst deploy --stage "${{ steps.stage.outputs.stage }}"
            exit 0
          fi

          echo "SST deploy failed for a reason other than a lock. See log above."
          exit 1
        env:
          SST_LOG: debug
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
